[browser]
type=transport
protocol=ws
bind=127.0.0.1

[alice-auth]
type=auth
auth_type=userpass
username=alice
password=test-password

[alice]
type=aor
max_contacts=1

[alice-endpoint]
type=endpoint
transport=browser
auth=alice-auth
aors=alice
context=internal
disallow=all
allow=ulaw
webrtc=yes
dtmf_mode=info

[bob-auth]
type=auth
auth_type=userpass
username=bob
password=test-password

[bob]
type=aor
max_contacts=1

[bob-endpoint]
type=endpoint
transport=browser
auth=bob-auth
aors=bob
context=internal
disallow=all
allow=ulaw
webrtc=yes
dtmf_mode=info
