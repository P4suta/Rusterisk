[udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[auth]
type = auth
auth_type = userpass
username = phone
password = test-password

[dynamic]
type = aor
max_contacts = 1

[static]
type = aor
contact = sip:phone@127.0.0.1:5099

[phone]
type = endpoint
transport = udp
auth = auth
aors = dynamic
context = internal
disallow = all
allow = ulaw

[phone-extra]
type = endpoint
transport = udp
auth = auth
aors = static
context = internal
disallow = all
allow = ulaw

