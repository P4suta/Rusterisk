[general]
static = yes
writeprotect = yes

[internal]
exten => 100,1,Stasis(compat-app)
same => n,Hangup()

[route-order]
exten => _X,1,Stasis(compat-app,digit,${EXTEN})
exten => _X!,1,Stasis(compat-app,early,${EXTEN})
exten => _NXX,1,Stasis(compat-app,narrow,${EXTEN})
exten => _ZXX,1,Stasis(compat-app,wide,${EXTEN})
exten => 3-00,1,Stasis(compat-app,exact,${EXTEN})
exten => _[+0-9].,1,gOtO(route-result,${EXTEN},2)

[route-result]
exten => _.,2,Stasis(compat-app,jump,${EXTEN})
