[package]
name = "rusterisk-input-fuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[package.metadata]
cargo-fuzz = true

[features]
fuzz = ["dep:libfuzzer-sys"]
signaling = ["dep:rusterisk-sip"]
media = ["dep:rusterisk-media"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13", optional = true }
rusterisk-api = { version = "=0.2.0", path = "../../crates/api" }
rusterisk-config = { version = "=0.2.0", path = "../../crates/config" }
rusterisk-sip = { version = "=0.2.0", path = "../../crates/sip", optional = true }
rusterisk-media = { version = "=0.2.0", path = "../../crates/media", optional = true }

[[bin]]
name = "settings"
path = "fuzz_targets/settings.rs"
test = false
doc = false
bench = false
required-features = ["fuzz"]

[[bin]]
name = "media_controls"
path = "fuzz_targets/media_controls.rs"
test = false
doc = false
bench = false
required-features = ["fuzz"]

[[bin]]
name = "sip"
path = "fuzz_targets/sip.rs"
test = false
doc = false
bench = false
required-features = ["fuzz", "signaling"]

[[bin]]
name = "media_packets"
path = "fuzz_targets/media_packets.rs"
test = false
doc = false
bench = false
required-features = ["fuzz", "media"]

[workspace]

[patch.crates-io]
str0m = { path = "../../vendor/str0m" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
await_holding_lock = "deny"
clone_on_ref_ptr = "deny"
disallowed_types = "deny"
exit = "deny"
let_underscore_future = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
