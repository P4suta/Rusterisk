[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
syn.workspace = true
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "=0.11.1"
semver = "=1.0.28"
zip = { version = "=9.6.0", default-features = false, features = [
  "deflate-flate2",
] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.11", default-features = false, features = [
  "miniz_oxide",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = [
  "std",
  "process",
] }
signal-hook = { version = "=0.4.6", default-features = false }

[lints]
workspace = true
