[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.95

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.12"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/webrtc-rs/webrtc"]
