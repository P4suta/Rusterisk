[package]
name = "rusterisk-server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rusterisk"
path = "src/main.rs"

[dependencies]
rusterisk-api = { version = "0.2.0", path = "../api" }
rusterisk-cli = { version = "0.2.0", path = "../cli" }
rusterisk-core = { version = "0.2.0", path = "../core" }
rusterisk-config = { version = "0.2.0", path = "../config" }
rusterisk-media = { version = "0.2.0", path = "../media" }
rusterisk-sip = { version = "0.2.0", path = "../sip" }
rusterisk-storage = { version = "0.2.0", path = "../storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
subtle = "2.6.1"
jiff = { version = "=1.0.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
axum = { version = "0.8.8", features = ["ws", "macros"] }
base64 = "0.23.1"
percent-encoding = "=2.3.2"
serde_urlencoded = "0.7.1"
uuid = { version = "1.22.0", features = ["v4"] }
getrandom = "0.4.3"
futures-util = { version = "0.3.32", features = ["sink"] }
hickory-resolver = { version = "=0.26.3", default-features = false, features = [
  "system-config",
  "tokio",
] }
rand = "=0.10.4"
str0m = { version = "=0.25.0", default-features = false, features = [
  "aws-lc-rs",
] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-native-roots",
] }
axum-server = { version = "=0.9.2", default-features = false, features = [
  "tls-rustls",
] }
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = [
  "server-auto",
  "tokio",
  "service",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
] }
rustls-native-certs = "0.8.5"
x509-parser = { version = "=0.18.1", default-features = false }
rsipstack = { version = "=0.8.6", default-features = false, features = ["std"] }
tower-http = { version = "0.7.1", default-features = false, features = [
  "timeout",
] }

[dev-dependencies]
rusterisk-test-support = { version = "0.2.0", path = "../test-support" }
allocation-counter = "=0.8.1"
rusterisk-client = { version = "0.2.0", path = "../client" }
tokio = { workspace = true, features = ["test-util"] }
sha2 = "0.11.0"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
opus = "=0.4.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "http2",
] }
rcgen = { version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
  "pem",
] }
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.32.0", default-features = false, features = [
  "process",
  "socket",
  "time",
  "uio",
] }

[lints]
workspace = true
