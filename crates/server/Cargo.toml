[package]
name = "rusterisk-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rusterisk"
path = "src/main.rs"

[dependencies]
rusterisk-api = { version = "0.1.0", path = "../api" }
rusterisk-core = { version = "0.1.0", path = "../core" }
rusterisk-config = { version = "0.1.0", path = "../config" }
rusterisk-media = { version = "0.1.0", path = "../media" }
rusterisk-sip = { version = "0.1.0", path = "../sip" }
rusterisk-storage = { version = "0.1.0", path = "../storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
subtle = "2.6.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
axum = { version = "0.8.8", features = ["ws", "macros"] }
base64 = "0.22.1"
serde_urlencoded = "0.7.1"
uuid = { version = "1.22.0", features = ["v4"] }
getrandom = "0.4.3"
futures-util = { version = "0.3.32", features = ["sink"] }
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-native-roots",
] }
axum-server = { version = "=0.8.0", default-features = false, features = [
  "tls-rustls",
] }
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = [
  "server-auto",
  "tokio",
  "service",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
] }
tower-http = { version = "0.6.8", default-features = false, features = [
  "timeout",
] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
rsipstack = { version = "=0.8.5", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "http2",
] }
rcgen = { version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
  "pem",
] }
tempfile = "3.27"

[lints]
workspace = true
