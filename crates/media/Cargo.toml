[package]
name = "rusterisk-media"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusterisk-core = { version = "0.2.0", path = "../core" }
bytes = "1.11.1"
rtc-crypto = { version = "=0.21.1", default-features = false, features = [
  "crypto-ring",
] }
rtc-rtp = "=0.21.1"
rtc-shared = { version = "=0.21.1", default-features = false, features = [
  "marshal",
] }
rtc-srtp = { version = "=0.21.1", default-features = false }
rtcp-types = "=0.3.0"
opus = "=0.4.0"

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints]
workspace = true
