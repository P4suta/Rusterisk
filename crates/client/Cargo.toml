[package]
name = "rusterisk-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed ARI client with owned call lifetimes"

[[example]]
name = "call"
test = true

[dependencies]
rusterisk-api = { version = "0.1.0", path = "../api" }
rusterisk-core = { version = "0.1.0", path = "../core" }
uuid = { version = "1.22.0", features = ["v4"] }
tracing = "0.1.44"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-native-roots",
] }
futures-util = { version = "0.3.32", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "http2",
] }
base64 = "0.22.1"
url = "2.5.8"

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
axum = "0.8.8"
rusterisk-server = { version = "0.1.0", path = "../server" }
rusterisk-config = { version = "0.1.0", path = "../config" }

[lints]
workspace = true
