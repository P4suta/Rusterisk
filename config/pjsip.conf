[udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[alice-auth]
type=auth
auth_type=userpass
username=alice
password=development-alice

[alice]
type=aor
max_contacts=1

[alice]
type=endpoint
transport=udp
auth=alice-auth
aors=alice
context=internal
disallow=all
allow=ulaw,alaw,opus
dtmf_mode=rfc4733

[bob-auth]
type=auth
auth_type=userpass
username=bob
password=development-bob

[bob]
type=aor
max_contacts=1

[bob]
type=endpoint
transport=udp
auth=bob-auth
aors=bob
context=internal
disallow=all
allow=ulaw,alaw,opus
dtmf_mode=rfc4733
