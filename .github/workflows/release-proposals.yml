name: Release proposals

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release proposal operation
        type: choice
        options:
          - verify-auth
          - propose
        default: verify-auth

permissions:
  contents: read

concurrency:
  group: release-proposals
  cancel-in-progress: false

jobs:
  proposal:
    name: Release proposal
    if: >-
      github.repository == 'P4suta/Rusterisk' &&
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'verify-auth' || vars.RELEASE_PLZ_PROPOSALS == 'enabled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-proposals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.operation != 'verify-auth'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: inputs.operation != 'verify-auth'
        with:
          version: 2026.10.24
          install_args: rust
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: inputs.operation != 'verify-auth'
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        id: credentials
        with:
          auth-method: token
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ vars.RELEASE_PLZ_DOPPLER_PROJECT }}
          doppler-config: ${{ vars.RELEASE_PLZ_DOPPLER_CONFIG }}
          inject-env-vars: false
      - name: Check release App inputs
        if: >-
          steps.credentials.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.credentials.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY, '${')
        run: exit 1
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ steps.credentials.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: P4suta
          repositories: Rusterisk
          permission-contents: ${{ inputs.operation == 'verify-auth' && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.operation == 'verify-auth' && 'read' || 'write' }}
      - name: Verify release App access
        if: inputs.operation == 'verify-auth'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/P4suta/Rusterisk/branches/main --silent
      - name: Open or refresh a draft release proposal
        if: inputs.operation != 'verify-auth'
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          CARGO_BUILD_JOBS: '2'
        run: mise x aqua:release-plz/release-plz@0.4.3 -- release-plz release-pr
